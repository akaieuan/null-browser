[package]
name = "null"
version = "0.1.0"
description = "An open-source privacy-first web browser."
authors = ["Ieuan <ieuan@ubik.studio>"]
license = "MPL-2.0"
repository = "https://github.com/akaieuan/null-browser"
edition = "2021"
rust-version = "1.77"

[lib]
name = "null_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
    "NSValue",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKUserContentController",
    "block2",
] }
